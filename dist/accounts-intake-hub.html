<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accounts Intake Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root {
  /* Layout: one working column. Tab strip on desktop, bottom bar on phones, entry details in a side drawer.
     Ledger green is the accent. Brass marks the client ledger so the two books never look alike. */
  --bg: #f2f4f1; --surface: #ffffff; --surface-2: #e9ede8; --ink: #17201b; --muted: #56635b; --line: #d3dad3;
  --accent: #1c5a49; --accent-ink: #ffffff; --accent-soft: #dcebe5;
  --brass: #7d5409; --brass-soft: #f4e7c8;
  --ok: #24703f; --ok-soft: #dcefe3; --warn: #8f5300; --warn-soft: #faebd0; --bad: #a42d25; --bad-soft: #f8dedb;
  --info: #2a5a95; --info-soft: #dde8f5; --neutral-soft: #e4e8e3; --scrim: rgba(12, 20, 16, .45);
  --shadow: 0 1px 2px rgba(20, 32, 26, .06), 0 8px 24px rgba(20, 32, 26, .08);
  --f-display: 'Newsreader', Georgia, 'Times New Roman', serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
--bg: #0e1411; --surface: #151e19; --surface-2: #1d2924; --ink: #e4ebe6; --muted: #9aaaa1; --line: #2a3832;
--accent: #54b595; --accent-ink: #06130d; --accent-soft: #17352b;
--brass: #e3b052; --brass-soft: #372b12;
--ok: #5cc283; --ok-soft: #173220; --warn: #e8a63f; --warn-soft: #36280f; --bad: #f28a80; --bad-soft: #3b1b18;
--info: #86b5f2; --info-soft: #17293f; --neutral-soft: #212c26; --scrim: rgba(0, 0, 0, .6);
--shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
color-scheme: dark;
  }
}
:root[data-theme="dark"] {
--bg: #0e1411; --surface: #151e19; --surface-2: #1d2924; --ink: #e4ebe6; --muted: #9aaaa1; --line: #2a3832;
--accent: #54b595; --accent-ink: #06130d; --accent-soft: #17352b;
--brass: #e3b052; --brass-soft: #372b12;
--ok: #5cc283; --ok-soft: #173220; --warn: #e8a63f; --warn-soft: #36280f; --bad: #f28a80; --bad-soft: #3b1b18;
--info: #86b5f2; --info-soft: #17293f; --neutral-soft: #212c26; --scrim: rgba(0, 0, 0, .6);
--shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }  /* author display rules (.drawer, .more-sheet, .note ...) must not defeat the hidden attribute */
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--ink); background: var(--bg); font: 15px/1.5 var(--f-body);
  -webkit-text-size-adjust: 100%;
}
#app { min-height: 100%; padding-block: 0 88px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { #app { padding-block-end: 48px; } }
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 600 1.7rem/1.15 var(--f-display); letter-spacing: -.01em; }
h2 { font: 600 1.25rem/1.2 var(--f-display); }
h3 { font: 600 .78rem/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.mono, .num, .er-id { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { white-space: nowrap; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding-block: 14px 10px; max-width: 1120px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand .name { font: 600 1.35rem/1.1 var(--f-display); letter-spacing: -.01em; }
.brand .sub { font-size: .78rem; color: var(--muted); letter-spacing: .02em; }
.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.who label { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); }
.who select { width: auto; max-width: 190px; }
.role { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.role.approver { color: var(--accent); border-color: var(--accent); }

/* tabs */
.tabs { display: none; max-width: 1120px; margin: 0 auto; border-bottom: 1px solid var(--line); gap: 2px; overflow-x: auto; }
.tabs button { font: inherit; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.badge { min-width: 1.3em; padding: 0 6px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: .72rem; line-height: 1.5; text-align: center; font-weight: 600; }
.badge.warn { background: var(--bad); color: #fff; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
@media (min-width: 900px) { .tabs { display: flex; } .bottom, .more-sheet { display: none !important; } }
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.bottom button { font: inherit; font-size: .7rem; background: none; border: 0; color: var(--muted); padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; position: relative; min-width: 0; }
.bottom button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.bottom .badge { position: absolute; top: 0; right: 18%; }
.more-sheet { position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 19; background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow); padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.more-sheet button { font: inherit; text-align: left; background: var(--surface-2); border: 0; border-radius: 6px; padding: 11px 12px; color: var(--ink); display: flex; gap: 8px; align-items: center; cursor: pointer; }

/* layout bits */
main { max-width: 1120px; margin: 0 auto; padding-top: 18px; display: block; }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grow { flex: 1 1 auto; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) { .grid2 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; } .grid2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card > h3 { margin-bottom: 10px; }
.card.flat { background: transparent; border-style: dashed; }
.note { background: var(--info-soft); color: var(--ink); border-radius: 6px; padding: 9px 12px; font-size: .88rem; }
.note.warn { background: var(--warn-soft); } .note.bad { background: var(--bad-soft); } .note.ok { background: var(--ok-soft); }
.scroll { overflow-x: auto; max-width: 100%; }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 700px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.kpi { font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi:hover { border-color: var(--accent); }
.kpi-l { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.kpi-n { font: 600 1.9rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi-s { font-size: .8rem; color: var(--muted); }
.kpi.bad .kpi-n { color: var(--bad); } .kpi.warn .kpi-n { color: var(--warn); }
.kpi .pair { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; font-size: .84rem; align-items: baseline; }
.kpi .pair b { font: 500 .86rem var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.kpi .pair { grid-template-columns: auto minmax(0, 1fr); }

/* chips and tags */
.chip { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .03em; padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--neutral-soft); color: var(--muted); }
.st-submitted { background: var(--info-soft); color: var(--info); }
.st-approved { background: var(--ok-soft); color: var(--ok); }
.st-returned { background: var(--warn-soft); color: var(--warn); }
.st-rejected { background: var(--bad-soft); color: var(--bad); }
.st-exported { background: var(--accent-soft); color: var(--accent); }
.st-overdue { background: var(--bad-soft); color: var(--bad); } .st-soon { background: var(--warn-soft); color: var(--warn); }
.st-done { background: var(--ok-soft); color: var(--ok); } .st-upcoming { background: var(--neutral-soft); color: var(--muted); }
.ltag { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 8px; border-radius: 4px; letter-spacing: .03em; white-space: nowrap; }
.l-office { border: 1px solid var(--accent); color: var(--accent); }
.l-client { background: var(--brass-soft); color: var(--brass); border: 1px solid var(--brass-soft); }
.type { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* entry rows */
.list { display: flex; flex-direction: column; }
.erow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 14px; align-items: center; padding: 11px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 4px; }
.erow:first-child { border-top: 0; }
.erow:hover { background: var(--surface-2); }
.er-main { display: flex; flex-direction: column; min-width: 0; }
.er-id { font-size: .75rem; color: var(--muted); }
.er-payee { font-weight: 600; overflow-wrap: anywhere; }
.er-desc { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.er-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.er-amt { display: flex; flex-direction: column; align-items: flex-end; min-width: 6.5rem; }
.er-amt .num { font-weight: 500; }
.er-date { font-size: .78rem; color: var(--muted); font-family: var(--f-mono); }
.er-act { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.er-sel { display: flex; align-items: center; gap: 10px; }
@media (max-width: 640px) {
  .erow { grid-template-columns: minmax(0, 1fr) auto; }
  .er-main { grid-column: 1 / -1; }
  .er-tags { justify-content: flex-start; }
}
.empty { padding: 22px 8px; color: var(--muted); text-align: center; }

/* forms and buttons */
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
textarea { resize: vertical; min-height: 84px; }
input:disabled, select:disabled { opacity: .6; }
.invalid { border-color: var(--bad) !important; }
.ferr { color: var(--bad); font-size: .8rem; min-height: 0; }
.ferr:empty { display: none; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .lbl { font-size: .8rem; font-weight: 600; color: var(--muted); }
.btn { font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent); padding: 6px 8px; }
.btn.sm { padding: 4px 10px; font-size: .84rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg label { display: block; position: relative; cursor: pointer; font-size: .88rem; font-weight: 500; color: var(--ink); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg span { display: block; padding: 7px 14px; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg.tabs2 button { font: inherit; border: 0; background: none; padding: 7px 14px; cursor: pointer; color: var(--ink); }
.seg.tabs2 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.totalbox { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0 6px; border-top: 1px solid var(--ink); border-bottom: 4px double var(--ink); margin-top: 4px; }
.totalbox .num { font-size: 1.35rem; font-weight: 500; }
.drop { display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; text-align: center; border: 2px dashed var(--line); border-radius: var(--r); padding: 26px 14px; cursor: pointer; color: var(--muted); background: var(--surface); }
.drop.over, .drop:hover { border-color: var(--accent); color: var(--ink); }
.drop strong { color: var(--ink); }
.attach { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
.attach img { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; flex: none; }
.attach .fi { width: 64px; height: 64px; border-radius: 4px; background: var(--surface-2); display: grid; place-items: center; font: 600 .75rem var(--f-mono); color: var(--muted); flex: none; }
.attach .meta { min-width: 0; flex: 1; overflow-wrap: anywhere; font-size: .86rem; }
.found { display: flex; flex-wrap: wrap; gap: 6px; }
.found .chip { background: var(--accent-soft); color: var(--accent); }
.found .chip.miss { background: var(--neutral-soft); color: var(--muted); }

/* tables */
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; }
td input, td select { padding: 5px 8px; font-size: .88rem; }
tr.tot td { border-top: 1px solid var(--ink); border-bottom: 4px double var(--ink); font-weight: 600; }
.pass { color: var(--ok); font-weight: 600; } .fail { color: var(--bad); font-weight: 600; }

/* compliance */
.rem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.rem:first-child { border-top: 0; }
.rem .t { font-weight: 600; overflow-wrap: anywhere; }
.rem .d { font-size: .85rem; color: var(--muted); }
.rem .act { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rem .done-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) auto; gap: 8px; width: 100%; }
@media (max-width: 560px) { .rem .done-form { grid-template-columns: minmax(0, 1fr); } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { font: inherit; font-size: .84rem; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; cursor: pointer; color: var(--ink); }
.chips button:hover { border-color: var(--accent); }

/* drawer */
#scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); z-index: 31; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 10px 16px; border-bottom: 1px solid var(--line); }
.drawer-body { overflow-y: auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 16px; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 5px 12px; font-size: .9rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.hist { display: flex; flex-direction: column; gap: 6px; font-size: .84rem; }
.hist div { display: grid; grid-template-columns: 8.4rem minmax(0, 1fr); gap: 8px; }
.hist .ts { font-family: var(--f-mono); color: var(--muted); font-size: .76rem; }
@media (max-width: 560px) { .hist div { grid-template-columns: minmax(0, 1fr); gap: 0; } .kv { grid-template-columns: minmax(0, 1fr); gap: 0; } .kv dd { margin-bottom: 6px; } }

/* toast */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(560px, calc(100% - 32px)); pointer-events: none; }
@media (min-width: 900px) { #toast { bottom: 28px; } }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; box-shadow: var(--shadow); font-size: .9rem; pointer-events: auto; }
.toast.bad { background: var(--bad); color: #fff; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: tin .18s ease-out; } @keyframes tin { from { opacity: 0; transform: translateY(6px); } } }

/* calendar */
.kpis.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
div.kpi { cursor: default; }
div.kpi:hover { border-color: var(--line); }
.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 1000px) {
  .cal-layout:not(.wide) { grid-template-columns: minmax(0, 1.85fr) minmax(300px, 1fr); align-items: start; }
  .cal-layout:not(.wide) .cal-panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
}
.cal-card { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.cal-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; }
.cal-nav { gap: 6px; }
.cal-title { font: 600 1.35rem/1.1 var(--f-display); letter-spacing: -.01em; min-width: 8.5rem; margin-inline: 6px; }
.cal-ph { font: 600 1.15rem/1.2 var(--f-display); }
.btn.icon { padding: 6px 8px; }
.cal-month { width: auto; padding: 5px 8px; font-size: .88rem; }
.cal-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.cal-layer { font: inherit; font-size: .84rem; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 4px 12px; cursor: pointer; }
.cal-layer b { font: 500 .76rem var(--f-mono); color: var(--muted); }
.cal-layer[aria-pressed="false"] { color: var(--muted); background: transparent; border-style: dashed; }
.cal-layer[aria-pressed="false"] .sw { opacity: .35; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.sw-deadlines { background: var(--warn); } .sw-documents { background: var(--accent); }

      weekStart: 1, // calendar week starts on Monday (1) or Sunday (0)
      dueDays: { EPF: 15, SOCSO: 15, EIS: 15, PCB: 15 },
      rates: {

  /* ---------- entries ---------- */
  function blankEntry(user) {
    return {
      id: null, type: 'bill', source: 'upload', docDate: '', payee: '', refNo: '', description: '', category: '',
      netAmount: 0, taxAmount: 0, totalAmount: 0, currency: 'MYR', ledger: 'office', matterNo: '',
      status: 'draft', createdBy: user ? user.id : '', createdAt: '', approvedBy: '', approvedAt: '',

  }

  function applyPatch(e, patch) {
    EDITABLE.forEach(function (k) {
